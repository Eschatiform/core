services:
  postgres:
    image: postgres:15-alpine
    container_name: odota-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yasp
      # PostgreSQL configuration for stability
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ./database/postgres:/var/lib/postgresql/data
    # Resource limits to prevent OOM kills
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
    # For docker-compose v2 compatibility
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 1.0
    # PostgreSQL tuning for container environment
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=4MB
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yasp"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  cassandra:
    image: cassandra:5.0
    container_name: odota-cassandra
    environment:
      JVM_EXTRA_OPTS: -Dcassandra.skip_wait_for_gossip_to_settle=0 -Xms512m -Xmx512m -XX:-UseContainerSupport
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
  minio:
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    image: minio/minio:latest
    container_name: odota-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: Hmwybs=9752!
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - ./matches:/data
  redis:
    image: redis:7
    container_name: odota-redis
  elasticsearch:
    image: elasticsearch:7.17.0
    container_name: odota-elasticsearch
    environment:
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - bootstrap.system_call_filter=false
      - 'ES_JAVA_OPTS=-Xms256m -Xmx256m -XX:-UseContainerSupport -Dlog4j2.disable.jmx=true'
      - discovery.type=single-node
      - xpack.ml.enabled=false
      - 'JDK_JAVA_OPTIONS=-XX:-UseContainerSupport -Dlog4j2.disable.jmx=true'
    ulimits:
      memlock:
        soft: -1
        hard: -1
  parser:
    image: odota/parser
    container_name: odota-parser
  core:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: sleep infinity
    ports:
      - '5000:5000'
      - '5100:5100'
    environment:
      PARSER_HOST: odota-parser:5600
      POSTGRES_URL: postgresql://postgres:postgres@odota-postgres/yasp
      READONLY_POSTGRES_URL: postgresql://readonly:readonly@odota-postgres/yasp
      REDIS_URL: redis://odota-redis:6379/0
      CASSANDRA_URL: cassandra://odota-cassandra/yasp
      ELASTICSEARCH_URL: odota-elasticsearch:9200
      ARCHIVE_S3_ENDPOINT: http://odota-minio:9000
    links:
      - postgres
      - redis
      - elasticsearch
      - parser
      - minio
      - cassandra
    container_name: odota-core
