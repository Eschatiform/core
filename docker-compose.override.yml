# Extends the configuration for development (inits and mounting directory into core)
services:
  postgresinit:
    image: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/usr/src
    container_name: odota-postgresinit
    entrypoint:
      [
        'bash',
        '-c',
        'sleep 15 && psql --file /usr/src/sql/init.sql postgres://postgres:postgres@odota-postgres/postgres && psql --file /usr/src/sql/create_tables.sql postgres://postgres:postgres@odota-postgres/yasp',
      ]
  cassandrainit:
    image: cassandra
    depends_on:
      cassandra:
        condition: service_started
    volumes:
      - .:/usr/src
    container_name: odota-cassandrainit
    entrypoint:
      [
        'bash',
        '-c',
        'sleep 60 && cqlsh -f /usr/src/sql/init.cql odota-cassandra && cqlsh -f /usr/src/sql/create_tables.cql -k yasp odota-cassandra',
      ]
  minioinit:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    volumes:
      - .:/usr/src
    container_name: odota-minioinit
    entrypoint: >
      /bin/sh -c '
      set -e;
      tries=0;
      until /usr/bin/mc alias set myminio http://odota-minio:9000 minioadmin minioadmin >/dev/null 2>&1 && /usr/bin/mc ls myminio >/dev/null 2>&1; do
        tries=$$((tries+1));
        if [ $$tries -gt 30 ]; then echo "MinIO not ready"; exit 1; fi;
        echo "Waiting for MinIO (S3 API :9000)..."; sleep 2;
      done;
      /usr/bin/mc mb myminio/opendota-blobs   >/dev/null 2>&1 || true;
      /usr/bin/mc mb myminio/opendota         >/dev/null 2>&1 || true;
      /usr/bin/mc mb myminio/opendota-players >/dev/null 2>&1 || true;
      /usr/bin/mc ls myminio;
      exit 0;
      '
  core:
    entrypoint: bash launch.sh
    volumes:
      - .:/usr/src
